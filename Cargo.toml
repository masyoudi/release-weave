[package]
name = "release-weave"
version = "0.1.0"
edition = "2024"
description = "Native desktop toolkit in Rust and GPUI for modern software release engineering"
license = "Apache-2.0"
repository = "https://github.com/masyoudi/release-weave"
homepage = "https://github.com/masyoudi/release-weave"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
git2 = "0.21.0"
gpui-kit = "0.8.0"
keyring = "4.2.0"
regex = "1.13.1"
rfd = "0.15"
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
