<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Background Decorative Grid Lines -->
  <path d="M24 160 H488 M24 352 H488 M160 24 V488 M352 24 V488" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />

  <!-- Intertwined Weave Ribbons / Git Tracks -->
  <!-- Track 1: Cyan/Blue Main Trunk -->
  <path d="M112 384 C 180 384, 180 256, 256 256 C 332 256, 332 128, 400 128" 
        fill="none" stroke="url(#glowGrad1)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Track 2: Purple/Indigo Weave -->
  <path d="M112 128 C 180 128, 180 256, 256 256 C 332 256, 332 384, 400 384" 
        fill="none" stroke="url(#glowGrad2)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Track 3: Emerald/Teal Center Bridge -->
  <path d="M112 256 H400" 
        fill="none" stroke="url(#glowGrad3)" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 16" opacity="0.75" />

  <!-- Commit Nodes & Release Milestones -->
  <!-- Left Nodes -->
  <circle cx="112" cy="128" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="10" />
  <circle cx="112" cy="256" r="16" fill="#0f172a" stroke="#34d399" stroke-width="8" />
  <circle cx="112" cy="384" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="10" />

  <!-- Center Confluence Node (The Weave) -->
  <circle cx="256" cy="256" r="32" fill="#1e1b4b" stroke="#ffffff" stroke-width="10" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#60a5fa" />

  <!-- Right Target Release Nodes -->
  <circle cx="400" cy="128" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="10" />
  <circle cx="400" cy="256" r="16" fill="#0f172a" stroke="#34d399" stroke-width="8" />
  <circle cx="400" cy="384" r="26" fill="#0f172a" stroke="#a855f7" stroke-width="10" />

  <!-- Tag / Release Accent Star at vX.X target -->
  <polygon points="400,104 406,120 422,120 409,130 414,146 400,136 386,146 391,130 378,120 394,120" fill="#38bdf8" />
</svg>
